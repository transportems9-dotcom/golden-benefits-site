<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gracias | Golden Benefits</title>
<meta name="description" content="Recibimos su solicitud. Un agente con licencia le llamará pronto.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f2a4a">
<link rel="canonical" href="https://www.golden-benefits.com/gracias.html">

<style>
:root{
  --azul:#0f2a4a; --oro-claro:#f0c95c; --crema:#fdfaf3;
  --texto:#17212e; --texto-suave:#4a5a6e; --verde:#1d6b45;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:grid; place-items:center;
  background:linear-gradient(160deg,#0f2a4a 0%,#1b4374 100%);
  font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  padding:24px;
}
.tarjeta{
  background:var(--crema); border-radius:20px; padding:44px 36px;
  max-width:480px; text-align:center; box-shadow:0 10px 34px rgba(0,0,0,.25);
  border-top:7px solid var(--oro-claro);
}
.marca{color:var(--azul); font-weight:800; font-size:.85rem; letter-spacing:.14em;
  text-transform:uppercase; margin-bottom:18px}
.check{
  width:64px; height:64px; border-radius:50%; background:var(--verde); color:#fff;
  display:grid; place-items:center; font-size:2rem; font-weight:900; margin:0 auto 20px;
}
h1{color:var(--azul); font-size:1.6rem; margin:0 0 12px; line-height:1.25}
p{color:var(--texto-suave); font-size:1.08rem; line-height:1.6; margin:0 0 8px}
a.volver{display:inline-block; margin-top:22px; color:var(--azul); font-weight:700; text-decoration:none}
a.volver:hover{text-decoration:underline}
</style>
</head>
<body>

<div class="tarjeta">
  <div class="marca">Golden Benefits Insurance</div>
  <div class="check" aria-hidden="true">✓</div>
  <h1>Recibimos sus datos, gracias.</h1>
  <p>Ernesto le va a llamar pronto, a la hora que usted eligió.</p>
  <p>Si no reconoce el número cuando suene, conteste — es su llamada.</p>
  <a class="volver" href="/">Volver al inicio</a>
</div>
