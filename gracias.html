<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gracias | Golden Benefits</title>
<meta name="description" content="Recibimos su solicitud. Un agente con licencia le llamará pronto.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f2a4a">
<link rel="canonical" href="https://www.golden-benefits.com/gracias.html">

<style>
:root{
  --azul:#0f2a4a; --oro-claro:#f0c95c; --crema:#fdfaf3;
  --texto:#17212e; --texto-suave:#4a5a6e; --verde:#1d6b45;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; min-height:100vh;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
  background:linear-gradient(160deg,#0f2a4a 0%,#1b4374 100%);
  font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  padding:24px;
}
.tarjeta{
  background:var(--crema); border-radius:20px; padding:44px 36px;
  width:100%; max-width:480px; text-align:center; box-shadow:0 10px 34px rgba(0,0,0,.25);
  border-top:7px solid var(--oro-claro);
}
.testimonios{
  background:var(--crema); border-radius:20px; padding:30px 32px;
  width:100%; max-width:480px; box-shadow:0 10px 34px rgba(0,0,0,.25);
}
.testimonios h2{
  margin:0 0 18px; text-align:center; color:var(--azul);
  font-size:.9rem; letter-spacing:.14em; text-transform:uppercase;
}
.testimonios figure{margin:0}
.testimonios figure + figure{margin-top:24px; padding-top:24px; border-top:1px solid #e2dbcc}
.testimonios blockquote{margin:0; font-size:1.2rem; line-height:1.6; color:var(--texto)}
.testimonios blockquote::before{
  content:"\201C"; display:block; color:#b8860f;
  font-size:3.6rem; line-height:.7; font-family:Georgia,serif; margin-bottom:6px;
}
.testimonios figcaption{margin-top:14px; color:var(--azul); font-weight:800; font-size:1.05rem}
.testimonios figcaption span{display:block; color:var(--texto-suave); font-weight:400; font-size:.95rem}
.marca{color:var(--azul); font-weight:800; font-size:.85rem; letter-spacing:.14em;
  text-transform:uppercase; margin-bottom:18px}
.check{
  width:64px; height:64px; border-radius:50%; background:var(--verde); color:#fff;
  display:grid; place-items:center; font-size:2rem; font-weight:900; margin:0 auto 20px;
}
h1{color:var(--azul); font-size:1.6rem; margin:0 0 12px; line-height:1.25}
p{color:var(--texto-suave); font-size:1.08rem; line-height:1.6; margin:0 0 8px}
a.volver{display:inline-block; margin-top:22px; color:var(--azul); font-weight:700; text-decoration:none}
a.volver:hover{text-decoration:underline}
</style>
</head>
<body>

<div class="tarjeta">
  <div class="marca">Golden Benefits Insurance</div>
  <div class="check" aria-hidden="true">✓</div>
  <h1>Recibimos sus datos, gracias.</h1>
  <p>Ernesto le va a llamar pronto, a la hora que usted eligió.</p>
  <p>Si no reconoce el número cuando suene, conteste — es su llamada.</p>
  <a class="volver" href="/">Volver al inicio</a>
</div>

<!-- Testimonios — solo con palabras reales del cliente y su permiso por escrito.
     Para agregar otro, copie un bloque <figure>…</figure> completo debajo del último.
     Evite montos, nombres de planes o aseguradoras y condiciones de salud. -->
<section class="testimonios" aria-labelledby="titulo-testimonios">
  <h2 id="titulo-testimonios">Lo que dicen mis clientes</h2>
  <figure>
    <blockquote>
      El Sr. Ernesto me ayudó desde el primer día a entender mis opciones con mi cobertura de
      Medicare, todo ha sido muy claro y transparente para mí.
    </blockquote>
    <figcaption>Angela R., 67 años <span>Clienta de Golden Benefits</span></figcaption>
  </figure>
  <figure>
    <blockquote>
      Siempre he contado con Ernesto y su equipo, siempre ayudándome cuando tengo dudas.
    </blockquote>
    <figcaption>Teresa L. <span>Clienta de Golden Benefits</span></figcaption>
  </figure>
  <figure>
    <blockquote>
      Desde que cuento con el Sr. Ernesto el camino de cobertura de salud ha sido más fácil,
      todo explicado al detalle.
    </blockquote>
    <figcaption>Roberto H. <span>Cliente de Golden Benefits</span></figcaption>
  </figure>
</section>
